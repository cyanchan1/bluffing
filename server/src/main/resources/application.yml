spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blufftable}
    username: ${DB_USERNAME:blufftable}
    password: ${DB_PASSWORD:blufftable}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  address: 127.0.0.1
  port: ${PORT:8080}
